<div id="top-toast" class="top-toast">
  <div class="top-toast-icon">!</div>
  <div class="top-toast-content">
    <strong>Mamateyka 30 rokov</strong> Príďte s nami osláviť 30 rokov.
    <a class="top-toast-program" href="/30-rokov-mamateyky">Zobraziť program</a>
  </div>
  <button class="top-toast-close" aria-label="Zavrieť">×</button>
</div>
<p>
  <style>
    .top-toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 8;

      display: flex;
      align-items: center;
      gap: 10px;

      width: calc(100vw - 20px);
      max-width: 1200px;
      box-sizing: border-box;

      padding: 9px 12px 9px 10px;

      background: #ffffff;
      color: #1d2630;

      border-radius: 10px;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

      font-family: inherit;

      transition:
        transform 0.3s ease,
        opacity 0.3s ease;

      opacity: 0;
      transform: translateX(-50%) translateY(20px);

      touch-action: pan-y;
    }

    .top-toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .top-toast-icon {
      width: 27px;
      height: 27px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #537891;
      color: white;

      border-radius: 50%;

      font-size: 14px;
      font-weight: 700;
    }

    .top-toast-content {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 1;

      line-height: 1.3;
    }

    .top-toast-content strong {
      font-size: 14px;
      white-space: nowrap;
    }

    .top-toast-content span {
      font-size: 13px;
      color: #68737c;
      white-space: nowrap;
    }

    .top-toast-program {
      display: inline-block;
      flex-shrink: 0;
      border: 0;
      padding: 7px 11px;
      background: #537891;
      color: #ffffff !important;
      border-radius: 6px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .top-toast-program:hover {
      background: #41647a;
      color: #ffffff !important;
    }

    .top-toast-close {
      flex-shrink: 0;

      width: 24px;
      height: 24px;

      border: 0;
      padding: 0;

      background: transparent;
      color: #7a858d;

      font-size: 21px;
      line-height: 1;

      cursor: pointer;
    }

    .top-toast-close:hover {
      color: #1d2630;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .top-toast {
        top: 62px;
        width: calc(100vw - 20px);

        padding: 8px 10px 8px 8px;
      }

      .top-toast-content {
        display: block;
      }

      .top-toast-content strong {
        display: block;
        font-size: 13px;
      }

      .top-toast-content span {
        display: block;
        font-size: 12px;
        margin-top: 2px;
      }

      .top-toast-program {
        display: inline-block;
        margin: 7px 0 0;
        padding: 6px 8px;
        font-size: 11px;
        width: fit-content;
      }
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toast = document.getElementById("top-toast");
      const close = toast.querySelector(".top-toast-close");
      const program = toast.querySelector(".top-toast-program");
      const storageKey = "top-toast-seen";

      // sessionStorage môže byť v niektorých prehliadačoch/režimoch nedostupný
      let alreadySeen = false;
      try {
        alreadySeen = sessionStorage.getItem(storageKey) === "1";
      } catch (e) {}

      if (alreadySeen) {
        toast.remove();
        return;
      }

      toast.classList.add("is-visible");

      let startX = 0;
      let currentX = 0;
      let dragging = false;

      // Zavretie tlačidlom
      close.addEventListener("click", function () {
        hideToast();
      });

      program.addEventListener("click", function () {
        try {
          sessionStorage.setItem(storageKey, "1");
        } catch (e) {}
      });

      // Swipe
      toast.addEventListener("touchstart", function (e) {
        startX = e.touches[0].clientX;
        currentX = startX;
        dragging = true;
        toast.style.transition = "none";
      });

      toast.addEventListener("touchmove", function (e) {
        if (!dragging) return;

        currentX = e.touches[0].clientX;
        const diff = currentX - startX;

        toast.style.transform = `translateX(calc(-50% + ${diff}px))`;
      });

      toast.addEventListener("touchend", function () {
        if (!dragging) return;

        dragging = false;

        const diff = currentX - startX;

        toast.style.transition = "transform 0.3s ease, opacity 0.3s ease";

        // Swipe dostatočne ďaleko → zavrieť
        if (Math.abs(diff) > 80) {
          try {
            sessionStorage.setItem(storageKey, "1");
          } catch (e) {}

          toast.style.transform = `translateX(calc(-50% + ${diff > 0 ? 1000 : -1000}px))`;
          toast.style.opacity = "0";

          setTimeout(function () {
            toast.remove();
          }, 300);
        } else {
          // Vrátiť späť
          toast.style.transform = "translateX(-50%)";
        }
      });

      function hideToast() {
        try {
          sessionStorage.setItem(storageKey, "1");
        } catch (e) {}

        toast.style.opacity = "0";
        toast.style.transform = "translateX(-50%) translateY(-20px)";

        setTimeout(function () {
          toast.remove();
        }, 300);
      }
    });
  </script>
</p>
