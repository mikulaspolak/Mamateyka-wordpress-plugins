<!--
  Blok "Podporte nás" – vertikálne taby s platobnými údajmi (IBAN, prijímateľ,
  poznámka, variabilný symbol, QR kód).

  Ako vložiť do WordPressu:
  1. V editore stránky/príspevku vlož blok "Vlastné HTML" (Custom HTML) – NIE
     Klasický editor / Odsek, tie by mohli <script> tagy odstrániť.
  2. Skopíruj sem CELÝ obsah tohto súboru (aj <style>, aj oba <script> bloky).
  3. Publikuj. Vyžaduje sa právo "unfiltered_html" (bežne má Administrátor).

  Úprava obsahu:
  - Spoločné údaje (IBAN, meno prijímateľa) sú v premenných DNB_IBAN_RAW /
    DNB_IBAN_DISPLAY / DNB_RECIPIENT nižšie.
  - Jednotlivé položky (taby) sú v poli DNB_ITEMS – skopírovaním jedného
    objektu vieš jednoducho pridať ďalšiu položku. Pole "variableSymbol" sa
    dá vynechať (null), ak položka variabilný symbol nemá.
  - Dostupné ikony (kľúč "icon"): priest, cross, home, ball, compass, church, heart, coffee.
-->
<style>
  .dnb-widget,
  .dnb-widget *,
  .dnb-widget *::before,
  .dnb-widget *::after {
    box-sizing: border-box;
  }

  .dnb-widget {
    --dnb-primary: var(--bde-brand-primary-color, #537891);
    --dnb-primary-soft: color-mix(in srgb, var(--dnb-primary) 12%, white);
    --dnb-border: color-mix(in srgb, var(--dnb-primary) 16%, white);
    --dnb-bg: #ffffff;
    --dnb-list-bg: var(--bde-background-color, #f4f8fa);
    --dnb-muted: var(--bde-palette-color-1-2389698e-530b-4029-863b-90eb0fd3d128, #5d6c75);
    --dnb-text: var(--bde-body-text-color, #1d2630);
    --dnb-heading: var(--bde-headings-color, #161b23);
    --dnb-radius: 16px;

    width: 100%;
    font-family: inherit;
    background: var(--dnb-bg);
    border: 1px solid var(--dnb-border);
    border-radius: var(--dnb-radius);
    box-shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.15);
    overflow: hidden;
    color: var(--dnb-text);
    line-height: 1.5;
  }

  /* ---------- Zoznam tabov (mobile-first: block zoznam) ---------- */
  .dnb-list {
    display: flex;
    flex-direction: column;
    background: var(--dnb-list-bg);
    border-bottom: 1px solid var(--dnb-border);
  }

  .dnb-item {
    border-bottom: 1px solid var(--dnb-border);
  }

  .dnb-item:last-child {
    border-bottom: none;
  }

  .dnb-tab {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    background: transparent;
    border: none;
    font: inherit;
    font-size: 15px;
    color: var(--dnb-text);
    text-align: left;
    cursor: pointer;
  }

  .dnb-tab:hover {
    background: color-mix(in srgb, var(--dnb-primary) 6%, transparent);
  }

  .dnb-tab:focus-visible {
    outline: 2px solid var(--dnb-primary);
    outline-offset: -2px;
  }

  .dnb-tab-icon {
    display: inline-flex;
    flex-shrink: 0;
    color: var(--dnb-muted);
  }

  .dnb-tab-icon svg {
    width: 20px;
    height: 20px;
  }

  .dnb-tab-label {
    flex: 1;
    font-weight: 500;
  }

  .dnb-tab-chevron {
    display: inline-flex;
    flex-shrink: 0;
    margin-left: auto;
    color: var(--dnb-primary);
    opacity: 0.55;
    transition: transform 0.35s ease;
  }

  .dnb-tab-chevron svg {
    width: 20px;
    height: 20px;
  }

  .dnb-item.is-open .dnb-tab-chevron {
    opacity: 1;
    transform: rotate(180deg);
  }

  .dnb-tab.is-active {
    background: var(--dnb-primary-soft);
  }

  .dnb-tab.is-active .dnb-tab-icon,
  .dnb-tab.is-active .dnb-tab-label {
    color: var(--dnb-primary);
  }

  .dnb-tab.is-active .dnb-tab-label {
    font-weight: 700;
  }

  /* ---------- Obsahový panel – spoločné štýly (desktop aj mobil) ---------- */
  .dnb-panel-inner {
    padding: 24px 22px;
  }

  .dnb-panel-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .dnb-panel-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 12px;
    background: var(--dnb-primary-soft);
    color: var(--dnb-primary);
  }

  .dnb-panel-icon svg {
    width: 24px;
    height: 24px;
  }

  .dnb-panel-title {
    margin: 0;
    font-size: 19px;
    line-height: 1.3;
    color: var(--dnb-heading);
  }

  .dnb-bullets {
    margin: 0 0 18px;
    padding-left: 20px;
    color: var(--dnb-text);
  }

  .dnb-bullets li {
    margin-bottom: 6px;
  }

  .dnb-payment {
    background: var(--dnb-list-bg);
    border: 1px solid var(--dnb-border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .dnb-payment-title {
    margin: 0 0 8px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--dnb-muted);
  }

  .dnb-field {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--dnb-border);
  }

  .dnb-field:last-of-type {
    border-bottom: none;
  }

  .dnb-field-label {
    flex: 0 0 100%;
    font-size: 13px;
    color: var(--dnb-muted);
  }

  .dnb-field-value {
    flex: 1 1 0;
    min-width: 0;
    font-weight: 600;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .dnb-copy-btn {
    flex: 0 0 32px;
    flex-shrink: 0;
    align-self: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--dnb-border);
    background: var(--dnb-bg);
    color: var(--dnb-muted);
    cursor: pointer;
    transition:
      background 0.15s ease,
      color 0.15s ease,
      border-color 0.15s ease;
  }

  .dnb-copy-btn:hover {
    background: var(--dnb-primary-soft);
    color: var(--dnb-primary);
    border-color: var(--dnb-primary);
  }

  .dnb-copy-btn:focus-visible {
    outline: 2px solid var(--dnb-primary);
    outline-offset: 1px;
  }

  .dnb-copy-btn.is-copied {
    background: #e6f8ee;
    color: #16a34a;
    border-color: #16a34a;
  }

  .dnb-qr-block {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
    text-align: left;
  }

  .dnb-qr-wrapper {
    display: inline-flex;
    justify-content: center;
    width: auto;
    flex-shrink: 0;
    position: relative;
  }

  .dnb-qr-wrapper::before,
  .dnb-qr-wrapper::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2px solid var(--dnb-primary);
  }

  .dnb-qr-wrapper::before {
    top: -9px;
    left: -9px;
    border-right: none;
    border-bottom: none;
    border-top-left-radius: 13px;
  }

  .dnb-qr-wrapper::after {
    top: -9px;
    right: -9px;
    border-left: none;
    border-bottom: none;
    border-top-right-radius: 13px;
  }

  .dnb-qr-container {
    display: flex;
    position: relative;
    align-items: center;
    justify-content: center;
    width: 140px;
    height: 140px;
    padding: 8px;
    background: var(--dnb-bg);
    border: 1px solid var(--dnb-border);
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
  }

  .dnb-qr-container::before,
  .dnb-qr-container::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2px solid var(--dnb-primary);
  }

  .dnb-qr-container::before {
    bottom: -9px;
    left: -9px;
    border-right: none;
    border-top: none;
    border-bottom-left-radius: 13px;
  }

  .dnb-qr-container::after {
    bottom: -9px;
    right: -9px;
    border-left: none;
    border-top: none;
    border-bottom-right-radius: 13px;
  }

  .dnb-qr-container svg {
    width: 140px;
    height: 140px;
  }

  .dnb-qr-text {
    flex: 0 1 auto;
    min-width: 0;
    text-align: left;
  }

  .dnb-qr-caption,
  .dnb-qr-fallback {
    margin: 0;
    font-size: 14px;
    font-weight: 300;
    color: var(--dnb-text);
    line-height: 1.4;
  }

  .dnb-qr-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    text-align: center;
    gap: 0;
  }

  .dnb-qr-loading .dnb-qr-fallback {
    font-size: 13px;
    font-weight: 400;
    color: color-mix(in srgb, var(--dnb-text) 62%, white);
    animation: dnbLoadingPulse 1.4s ease-in-out infinite;
  }

  /* ---------- Animácia desktop panelu (fade + slide) ---------- */
  @keyframes dnbFadeSlideIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes dnbLoadingPulse {
    0%,
    100% {
      color: color-mix(in srgb, var(--dnb-text) 55%, white);
    }
    50% {
      color: color-mix(in srgb, var(--dnb-text) 78%, white);
    }
  }

  /* ---------- Mobil (default): akordeón panel pod tabom ---------- */
  .dnb-mobile-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.45s ease;
    background: var(--dnb-bg);
  }

  .dnb-panel-desktop {
    display: none;
    animation: dnbFadeSlideIn 0.3s ease-out;
  }

  /* ---------- Desktop (>=768px): dva stĺpce, taby vľavo ---------- */
  @media (min-width: 768px) {
    .dnb-widget {
      display: flex;
      align-items: stretch;
    }

    .dnb-list {
      flex: 0 0 280px;
      border-bottom: none;
      border-right: 1px solid var(--dnb-border);
    }

    .dnb-tab {
      border-radius: 10px;
      margin: 4px 8px;
      width: calc(100% - 16px);
    }

    .dnb-tab-chevron {
      display: none;
    }

    .dnb-mobile-panel {
      display: none !important;
    }

    .dnb-panel-desktop {
      display: block;
      flex: 1;
      min-width: 0;
    }

    .dnb-field-label {
      flex: 0 0 130px;
    }
  }

  /* ---------- Mobile (<768px): QR text ostava vpravo ---------- */
  @media (max-width: 767px) {
    .dnb-qr-wrapper {
      display: flex;
      justify-content: center;
    }
  }
</style>

    // ---------- Pomocné funkcie ----------
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (ch) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[ch];
      });
    }

    function normalizeQrText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[–—−]/g, "-")
        .replace(/\s+/g, " ")
        .trim();
    }

        escapeHtml(row.label) +
        "</span>" +
        '<span class="dnb-field-value">' +
        escapeHtml(row.value) +
        "</span>" +
        '<button type="button" class="dnb-copy-btn" data-copy="' +
        escapeHtml(row.copyValue) +
        '" aria-label="Kopírovať: ' +
        escapeHtml(row.label) +
        '">' +
        ICONS.copy +
        "</button>" +
        "</div>"
      );
    }

    function buildPaymentRows(item) {
      var payment = item.payment || {};
      var rows = [];

      var ibanDisplay = payment.ibanDisplay || DNB_IBAN_DISPLAY;
      var ibanRaw = payment.ibanRaw || DNB_IBAN_RAW;
      rows.push({ label: "IBAN", value: ibanDisplay, copyValue: ibanRaw });

      var recipient = payment.recipient || DNB_RECIPIENT;
      if (recipient) {
        rows.push({
          label: "Meno prijímateľa",
          value: recipient,
          copyValue: recipient,
        });
      }

      if (payment.location) {
        rows.push({
          label: "Prevádzka / stredisko",
          value: payment.location,
          copyValue: payment.location,
        });
      }

      if (payment.ico) {
        rows.push({ label: "IČO", value: payment.ico, copyValue: payment.ico });
      }

      if (payment.dic) {
        rows.push({ label: "DIČ", value: payment.dic, copyValue: payment.dic });
      }

      rows.push({
        label: "Poznámka platby",
        value: item.note,
        copyValue: item.note,
      });

      if (item.variableSymbol) {
        rows.push({
          label: "Variabilný symbol",
          value: item.variableSymbol,
          copyValue: item.variableSymbol,
        });
      }

      return rows;
    }

    function buildPanelHTML(item) {
      var rows = buildPaymentRows(item);

      return (
        '<div class="dnb-panel-inner">' +
        '<div class="dnb-panel-header">' +
        '<h3 class="dnb-panel-title">' +
        escapeHtml(item.title) +
        "</h3>" +
        "</div>" +
        '<ul class="dnb-bullets">' +
        item.bullets
          .map(function (b) {
            return "<li>" + escapeHtml(b) + "</li>";
          })
          .join("") +
        "</ul>" +
        '<div class="dnb-payment">' +
        '<h4 class="dnb-payment-title">Platobné informácie</h4>' +
        rows.map(buildFieldRowHTML).join("") +
        '<div class="dnb-qr-block">' +
        '<div class="dnb-qr-wrapper">' +
        '<div class="dnb-qr-container" data-item-id="' +
        escapeHtml(item.id) +
        '" aria-label="QR kód pre platbu"></div>' +
        "</div>" +
        '<div class="dnb-qr-text">' +
        '<p class="dnb-qr-caption">Naskenujte<br>v mobilnej banke.</p>' +
        "</div>" +
        "</div>" +
        "</div>" +
        "</div>"
      );
    }

    function requestQr(item, containerEl) {
      if (!containerEl) return;
      if (typeof window.dnbGenerateQr === "function") {
        window.dnbGenerateQr(item, containerEl);
      } else {
        containerEl.innerHTML =
          '<div class="dnb-qr-loading"><p class="dnb-qr-fallback">QR kód sa<br>načítava…</p></div>';
      }
    }

    // ---------- Aktívny tab (zvýraznenie) ----------
    function markActiveTab(id) {
      activeId = id;
      var tabs = listEl.querySelectorAll(".dnb-tab");
      for (var i = 0; i < tabs.length; i++) {
        var isActive = tabs[i].getAttribute("data-id") === id;
        tabs[i].classList.toggle("is-active", isActive);
        tabs[i].setAttribute("aria-selected", isActive ? "true" : "false");
      }
    }

    // ---------- Desktop panel ----------
    function renderDesktopPanel(item) {
      panelDesktopEl.style.animation = "none";
      panelDesktopEl.innerHTML = buildPanelHTML(item);
      requestAnimationFrame(function () {
        panelDesktopEl.style.animation = "dnbFadeSlideIn 0.3s ease-out";
      });
      requestQr(item, panelDesktopEl.querySelector(".dnb-qr-container"));
    }

    // ---------- Mobilný akordeón ----------
    function closeMobilePanel(itemEl, animate) {
      var panelEl = itemEl.querySelector(".dnb-mobile-panel");
      var tabBtn = itemEl.querySelector(".dnb-tab");
      itemEl.classList.remove("is-open");
      tabBtn.setAttribute("aria-expanded", "false");

      if (animate === false) {
        panelEl.style.maxHeight = "";
        panelEl.innerHTML = "";
        return;
      }

      panelEl.style.maxHeight = panelEl.scrollHeight + "px";
      requestAnimationFrame(function () {
        panelEl.style.maxHeight = "0px";
      });
      var handler = function () {
        if (!itemEl.classList.contains("is-open")) {
          panelEl.innerHTML = "";
        }
        panelEl.removeEventListener("transitionend", handler);
      };
      panelEl.addEventListener("transitionend", handler);
    }

    function openMobilePanel(itemEl, item) {
      var panelEl = itemEl.querySelector(".dnb-mobile-panel");
      var tabBtn = itemEl.querySelector(".dnb-tab");
      panelEl.innerHTML = buildPanelHTML(item);
      itemEl.classList.add("is-open");
      tabBtn.setAttribute("aria-expanded", "true");
      requestQr(item, panelEl.querySelector(".dnb-qr-container"));

      panelEl.style.maxHeight = "0px";
      panelEl.offsetHeight; // force reflow – ensures browser registers start state before transition
      panelEl.style.maxHeight = panelEl.scrollHeight + "px";
    }

    function toggleMobilePanel(tabBtn, item) {
      var itemEl = tabBtn.closest(".dnb-item");
      var wasOpen = itemEl.classList.contains("is-open");

      var openItems = listEl.querySelectorAll(".dnb-item.is-open");
      for (var i = 0; i < openItems.length; i++) {
        if (openItems[i] !== itemEl) {
          closeMobilePanel(openItems[i]);
        }
      }

      if (wasOpen) {
        closeMobilePanel(itemEl);
        tabBtn.classList.remove("is-active");
        tabBtn.setAttribute("aria-selected", "false");
      } else {
        openMobilePanel(itemEl, item);
      }
    }

    // ---------- Výber položky (spoločné pre desktop aj mobil) ----------
    function selectItem(id, options) {
      options = options || {};
      var item = null;
      for (var i = 0; i < DNB_ITEMS.length; i++) {
        if (DNB_ITEMS[i].id === id) {
          item = DNB_ITEMS[i];
          break;
        }
      }
      if (!item) return;

      markActiveTab(id);
      renderDesktopPanel(item);

      if (options.toggleMobile) {
        var tabBtn = listEl.querySelector('.dnb-tab[data-id="' + id + '"]');
        toggleMobilePanel(tabBtn, item);
      }
    }

    // ---------- Kopírovanie do schránky ----------
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          document.execCommand("copy");
          resolve();
        } catch (err) {
          reject(err);
        } finally {
          document.body.removeChild(textarea);
        }
      });
    }

    function onCopyClick(btn) {
      var value = btn.getAttribute("data-copy") || "";
      copyToClipboard(value)
        .then(function () {
          var original = btn.innerHTML;
          btn.classList.add("is-copied");
          btn.innerHTML = ICONS.check;
          if (btn._dnbTimeout) {
            clearTimeout(btn._dnbTimeout);
          }
          btn._dnbTimeout = setTimeout(function () {
            btn.classList.remove("is-copied");
            btn.innerHTML = original;
          }, 1500);
        })
        .catch(function (err) {
          console.error("Kopírovanie zlyhalo:", err);
        });
    }

    // ---------- Delegované obsluhy udalostí ----------
    widgetRoot.addEventListener("click", function (e) {
      var tabBtn = e.target.closest(".dnb-tab");
      if (tabBtn) {
        selectItem(tabBtn.getAttribute("data-id"), { toggleMobile: true });
        return;
      }
      var copyBtn = e.target.closest(".dnb-copy-btn");
      if (copyBtn) {
        onCopyClick(copyBtn);
      }
    });

    // ---------- Inicializácia ----------
    renderTabsList();
    if (DNB_ITEMS.length > 0) {
      var item = DNB_ITEMS[0];
      var isMobile = window.innerWidth < 768;

      if (!isMobile) {
        // Na desktope: označiť prvú položku ako aktívnu a vykresliť panel
        markActiveTab(item.id);
        renderDesktopPanel(item);
      }
      // Na mobile: bez zvýraznenia, používateľ si sám vyberie, čo chce vidieť
    }
  })();
</script>

<script type="module">
  import { QRCode } from "https://esm.sh/@lostinbrittany/qr-esm@latest";
  import { CurrencyCode, encode, PaymentOptions } from "https://esm.sh/bysquare@3.0.0";

  window.dnbGenerateQr = function (item, containerEl) {
    try {
      var paymentData = (item && item.payment) || {};
      var qrRecipient = window.normalizeQrText(
        paymentData.qrRecipient || paymentData.recipient || window.DNB_RECIPIENT,
      );
      var payment = {
        type: PaymentOptions.PaymentOrder,
        currencyCode: CurrencyCode.EUR,
        paymentNote: item.note,
        beneficiary: { name: qrRecipient },
        bankAccounts: [{ iban: paymentData.ibanRaw || window.DNB_IBAN_RAW }],
      };
      if (item.variableSymbol) {
        payment.variableSymbol = item.variableSymbol;
      }
      var qrstring = encode({ payments: [payment] });
      containerEl.innerHTML = "";
      containerEl.appendChild(QRCode.generateSVG(qrstring));
    } catch (err) {
      console.error("Generovanie QR kódu zlyhalo:", err);
      containerEl.innerHTML =
        '<p class="dnb-qr-fallback">QR kód sa nepodarilo vygenerovať. Platbu zadajte manuálne podľa údajov vyššie.</p>';
    }
  };

  // Dogenerovať QR pre panely, ktoré sa vykreslili skôr, než sa tento modul načítal.
  document.querySelectorAll(".dnb-qr-container").forEach(function (el) {
    var id = el.getAttribute("data-item-id");
    var item = (window.DNB_ITEMS || []).filter(function (i) {
      return i.id === id;
    })[0];
    if (item) {
      window.dnbGenerateQr(item, el);
    }
  });
</script>
