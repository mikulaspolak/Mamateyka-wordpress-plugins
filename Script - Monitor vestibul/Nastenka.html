<div class="nast-root" id="nastenka">
  <header class="nast-header">
    <div class="nast-brand">
      <img class="nast-logo" src="https://mamateyka.sk/wp-content/uploads/2026/05/logo.png" alt="Mamateyka" />
      <div class="nast-brand-text">
        <div class="nast-brand-name">MAMATEYKA</div>
        <div class="nast-brand-sub" id="nast-subtitle"></div>
      </div>
    </div>
    <div class="nast-date">
      <div class="nast-date-num" id="nast-date"></div>
      <div class="nast-date-day" id="nast-day"></div>
    </div>
  </header>

  <main class="nast-body" id="nast-body">
    <!-- 1: Farske oznamy -->
    <section class="nast-slide" id="nastenka-1">
      <!-- Oznamy sa sem nacitaju skriptom z REST endpointu pluginu farske-oznamy (/embed). -->
      <div class="nast-scale-outer">
        <div class="nast-embed nast-scaled" id="nast-oznamy-slot"></div>
      </div>
    </section>

    <!-- 2: Liturgicky kalendar a omse -->
    <section class="nast-slide" id="nastenka-2">
      <!-- Rozpis sa sem nacita skriptom z REST endpointu pluginu rozpis-omsi (/embed). -->
      <div class="nast-scale-outer">
        <div class="nast-scaled" id="nast-rozpis-slot"></div>
      </div>
    </section>

    <!-- 3: Plagaty a pozvanky -->
    <section class="nast-slide" id="nastenka-3">
      <div class="nast-scale-outer">
        <div class="nast-embed nast-scaled" id="nast-obrazky-slot"></div>
      </div>
    </section>
  </main>

  <footer class="nast-footer">
    <div class="nast-progress" id="nast-progress"></div>
    <div class="nast-footer-place"></div>
    <div class="nast-dots" id="nast-dots"></div>
    <span class="nast-qr-copy"><span>Celý rozpis, oznamy, plagáty:</span></span>
    <a
      class="nast-qr-card"
      href="https://mamateyka.sk/farnost-vestibul"
      aria-label="Celý rozpis, oznamy a plagáty nájdeš na našom webe. Otvoriť stránku farnosti."
    >
      <!-- Staticky QR pre https://mamateyka.sk/farnost-vestibul ; pri zmene URL ho treba vygenerovat znova. -->
      <span class="nast-qr-code" id="nast-qr-code" role="img" aria-label="QR kód na stránku farnosti Mamateyka"
        ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 37" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h37v37H0z"/><path stroke="#000000" d="M4 4.5h7m2 0h1m1 0h1m1 0h1m2 0h1m1 0h3m1 0h7M4 5.5h1m5 0h1m2 0h4m1 0h3m1 0h1m3 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m1 0h3m1 0h1m2 0h2m2 0h2m1 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h5m2 0h3m4 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m1 0h1m4 0h1m2 0h1m2 0h2m1 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m1 0h8m1 0h2m1 0h1m1 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 11.5h1m1 0h4m4 0h3M4 12.5h1m1 0h5m7 0h2m1 0h1m1 0h1m2 0h5M5 13.5h1m2 0h1m2 0h1m2 0h1m1 0h1m3 0h4m2 0h3m3 0h1M4 14.5h3m2 0h2m1 0h1m3 0h1m2 0h3m2 0h1m2 0h2M4 15.5h3m1 0h2m1 0h1m4 0h1m1 0h2m2 0h2m1 0h1m2 0h2m1 0h1M5 16.5h3m2 0h2m2 0h1m6 0h1m1 0h1m5 0h2M5 17.5h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h2m1 0h9m3 0h1M4 18.5h1m2 0h1m1 0h5m1 0h1m1 0h3m1 0h1m2 0h1m2 0h4M5 19.5h5m2 0h2m2 0h2m1 0h2m2 0h1m3 0h1m3 0h1M5 20.5h1m1 0h1m2 0h1m1 0h1m1 0h1m3 0h4m2 0h1m4 0h2M4 21.5h1m1 0h1m1 0h1m2 0h1m2 0h1m5 0h1m2 0h2m1 0h3m1 0h1m1 0h1M4 22.5h1m2 0h1m1 0h2m1 0h4m3 0h4m2 0h4m1 0h1M4 23.5h1m1 0h1m2 0h1m2 0h2m2 0h1m1 0h1m4 0h2m3 0h1m2 0h1M4 24.5h1m2 0h2m1 0h1m1 0h2m5 0h3m1 0h6m1 0h3M12 25.5h1m3 0h3m1 0h1m3 0h1m3 0h5M4 26.5h7m2 0h3m1 0h4m2 0h2m1 0h1m1 0h3M4 27.5h1m5 0h1m1 0h6m1 0h2m1 0h1m1 0h1m3 0h1M4 28.5h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h2m1 0h2m1 0h5m1 0h1M4 29.5h1m1 0h3m1 0h1m1 0h1m1 0h2m1 0h1m2 0h4m5 0h4M4 30.5h1m1 0h3m1 0h1m1 0h1m2 0h1m1 0h1m1 0h1m5 0h7M4 31.5h1m5 0h1m2 0h3m4 0h1m3 0h6m1 0h1M4 32.5h7m1 0h5m2 0h3m1 0h1m2 0h2m2 0h1"/></svg></span>
      <span class="nast-qr-site">mamateyka.sk</span>
    </a>
  </footer>

  <section class="nast-mass-screen" aria-labelledby="nast-mass-title">
    <span class="nast-mass-cross" aria-hidden="true"></span>
    <div class="nast-mass-copy">
      <h1 class="nast-mass-title" id="nast-mass-title">Práve prebieha svätá omša</h1>
      <p class="nast-mass-label">MAMATEYKA · PETRŽALKA</p>
    </div>
  </section>
</div>

<style>
  #nastenka {
    /* Hodnoty preberane z premennych webu (Breakdance); druhy parameter je fallback. */
    --nast-primary: var(--bde-brand-primary-color, #537891);
    --nast-primary-dark: var(--bde-palette-color-1-85cd12d1-0c85-425c-87a7-5ac0ed8b516c, #40647d);
    --nast-heading: var(--bde-headings-color, #161b23);
    --nast-bg: var(--bde-background-color, #f4f8fa);
    --nast-bg-soft: var(--bde-palette-color-1-ac1398e0-ee51-4833-9fa4-66c3dbffc139, #e6eff3);
    --nast-bg-mid: var(--bde-palette-color-1-686a50a5-0a3f-4ff8-aaaf-e303f2841928, #cddfe7);
    --nast-panel: #ffffff;
    --nast-text: var(--bde-body-text-color, #1d2630);
    --nast-muted: var(--bde-palette-color-1-2389698e-530b-4029-863b-90eb0fd3d128, #5d6c75);
    --nast-border: rgba(160, 182, 194, 0.4);
    --nast-gold: var(--bde-palette-color-1-cf43b8a3-2324-49f8-b7f4-bcc578b0db81, #bf8027);
    --nast-gold-soft: var(--bde-palette-color-1-0345d457-9608-41d4-8c0f-b772e39ad1b8, #f1af57);
    --nast-font: var(--bde-body-font-family, "Fira Sans", sans-serif);
    --nast-font-heading: var(--bde-heading-font-family, "Fira Sans", sans-serif);
    --vs-fade: 300ms;

    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 100%;
    height: 100dvh;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    background: linear-gradient(140deg, var(--nast-bg) 0%, var(--nast-bg-soft) 100%);
    color: var(--nast-text);
    /* Fallback bez JS; skript nastavi velkost z rozmerov okna (bez stropu). */
    font-size: clamp(16px, 2.9vw, 52px);
    line-height: 1.45;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  #nastenka.nast-mass-active {
    overflow: hidden;
    background: #080b0e;
    color: #fff;
  }

  #nastenka .nast-mass-screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(32px, 4.5vh, 64px);
    padding: clamp(24px, 8vw, 100px);
    background: #080b0e;
    color: #fff;
    text-align: center;
  }

  #nastenka.nast-mass-active .nast-header,
  #nastenka.nast-mass-active .nast-body,
  #nastenka.nast-mass-active .nast-footer {
    visibility: hidden;
  }

  #nastenka.nast-mass-active .nast-mass-screen {
    display: flex;
  }

  #nastenka .nast-mass-cross {
    position: relative;
    flex: 0 0 auto;
    width: clamp(48px, 6.2vw, 84px);
    height: clamp(96px, 12.4vw, 168px);
    color: #537891;
  }

  #nastenka .nast-mass-cross::before,
  #nastenka .nast-mass-cross::after {
    position: absolute;
    display: block;
    content: "";
    background: currentColor;
  }

  #nastenka .nast-mass-cross::before {
    top: 32%;
    left: 0;
    width: 100%;
    height: 2px;
  }

  #nastenka .nast-mass-cross::after {
    top: 0;
    left: 50%;
    width: 2px;
    height: 100%;
    transform: translateX(-50%);
  }

  #nastenka .nast-mass-copy {
    display: grid;
    justify-items: center;
    gap: clamp(14px, 2vh, 24px);
    max-width: 100%;
  }

  #nastenka .nast-mass-title {
    max-width: min(100%, 20em);
    margin: 0;
    color: #fff;
    font-family: var(--nast-font-heading);
    font-size: clamp(1.5rem, 4.5vw, 3.75rem);
    font-weight: 500;
    line-height: 1.15;
    text-wrap: balance;
  }

  #nastenka .nast-mass-label {
    margin: 0;
    color: rgba(255, 255, 255, 0.58);
    font-size: clamp(0.75rem, 1.3vw, 1.1rem);
    font-weight: 500;
    letter-spacing: 0.18em;
  }

  #nastenka.nast-idle {
    cursor: none;
  }

  /* Obsah sa drzi v stlpci max. pomeru 3:4; sirku nastavuje skript. */
  #nastenka .nast-header,
  #nastenka .nast-body,
  #nastenka .nast-footer {
    width: var(--nast-stage-w, 100%);
    align-self: center;
  }

  #nastenka,
  #nastenka * {
    box-sizing: border-box;
    font-family: var(--nast-font);
  }

  html.nast-page-lock,
  html.nast-page-lock body {
    overflow: hidden !important;
    overscroll-behavior: none;
  }

  #nastenka h2:not(.nast-embed *),
  #nastenka h3:not(.nast-embed *),
  #nastenka h4:not(.nast-embed *),
  #nastenka p:not(.nast-embed *) {
    margin: 0;
    padding: 0;
    letter-spacing: normal;
    text-transform: none;
  }

  #nastenka h2,
  #nastenka h3,
  #nastenka h4,
  #nastenka .nast-brand-name {
    font-family: var(--nast-font-heading);
  }

  /* header + footer */
  #nastenka .nast-header,
  #nastenka .nast-footer {
    position: relative;
    z-index: 2;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1em;
    padding: 0.7em 1.2em;
    background: var(--nast-panel);
  }

  #nastenka .nast-footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    --nast-footer-height: 2.85em;
    --nast-footer-qr-size: calc(var(--nast-footer-height) + var(--nast-footer-height));
    height: var(--nast-footer-height);
  }

  #nastenka .nast-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 0.45em;
    font-size: calc(1em * var(--nast-chrome-zoom, 1));
    box-shadow: 0 4px 14px rgba(64, 100, 125, 0.12);
  }

  #nastenka .nast-footer {
    padding-top: 0.6em;
    padding-bottom: 0.6em;
    font-size: calc(0.7em * var(--nast-chrome-zoom, 1));
    color: var(--nast-muted);
    box-shadow:
      0 -2px 5px rgba(22, 27, 35, 0.06),
      0 -9px 22px rgba(64, 100, 125, 0.16);
  }

  #nastenka .nast-brand {
    display: flex;
    grid-column: 1;
    align-items: center;
    gap: 0.7em;
    min-width: 0;
  }

  #nastenka .nast-qr-card {
    display: grid;
    position: absolute;
    right: 0;
    bottom: 0;
    z-index: 4;
    grid-template-columns: var(--nast-footer-qr-size);
    grid-template-rows: minmax(0, 1fr) auto;
    align-items: center;
    width: max-content;
    max-width: calc(var(--nast-stage-w) - 2.4em);
    height: calc(var(--nast-footer-qr-size) + 1.5em);
    padding: 0.35em 0.45em 0.25em 0.25em;
    color: var(--nast-primary-dark);
    background: var(--nast-panel);
    border: 1px solid var(--nast-bg-mid);
    border-radius: 0.45em;
    box-shadow: 0 2px 8px rgba(64, 100, 125, 0.12);
    text-decoration: none;
  }

  #nastenka .nast-qr-copy {
    position: absolute;
    right: calc(var(--nast-footer-qr-size) + 1.3em);
    white-space: nowrap;
    color: var(--nast-primary);
    font-weight: 400;
    line-height: 1.1;
  }

  #nastenka .nast-qr-copy span {
    font-size: 0.8em;
  }

  #nastenka .nast-qr-code {
    display: grid;
    grid-column: 1;
    grid-row: 1;
    flex: none;
    width: var(--nast-footer-qr-size);
    height: var(--nast-footer-qr-size);
    aspect-ratio: 1;
    place-items: center;
    overflow: hidden;
    background: #fff;
  }

  #nastenka .nast-qr-code svg {
    display: block;
    width: 106%;
    height: 106%;
  }

  #nastenka .nast-qr-code.nast-qr-error {
    padding: 0.5em;
    color: var(--nast-muted);
    font-size: 0.3em;
    line-height: 1.2;
    text-align: center;
  }

  #nastenka .nast-footer-place,
  #nastenka .nast-qr-site {
    font-size: 0.7em;
    line-height: 1.1;
    font-weight: 500;
    white-space: nowrap;
    margin-bottom: 2px;
  }

  #nastenka .nast-qr-site {
    grid-column: 1;
    grid-row: 2;
    text-align: center;
  }

  #nastenka .nast-footer-place {
    color: var(--nast-primary-dark);
  }

  #nastenka img.nast-logo {
    flex: 0 0 auto;
    display: block;
    height: 2.5em !important;
    width: auto !important;
    max-width: none !important;
    margin: 0 !important;
  }

  #nastenka .nast-brand-name {
    font-weight: 700;
    font-size: 1.1em;
    letter-spacing: 0.02em;
    line-height: 1.2;
    color: var(--nast-heading);
  }

  #nastenka .nast-brand-sub {
    display: inline-block;
    margin-top: 0.25em;
    padding: 0.15em 0.8em;
    border-radius: 9999px;
    background: var(--nast-primary);
    color: #fff;
    font-size: 0.6em;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #nastenka .nast-brand-sub.nast-subtitle-exit {
    animation: nast-subtitle-out 180ms ease-in forwards;
  }

  #nastenka .nast-brand-sub.nast-subtitle-enter {
    animation: nast-subtitle-in 350ms cubic-bezier(0.2, 0.7, 0.25, 1) both;
  }

  @keyframes nast-subtitle-out {
    to {
      opacity: 0;
      transform: translateY(-0.6em);
    }
  }

  @keyframes nast-subtitle-in {
    from {
      opacity: 0;
      transform: translateY(0.6em) scale(0.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  #nastenka .nast-date {
    flex: 0 0 auto;
    grid-column: 3;
    justify-self: end;
    text-align: right;
  }

  #nastenka .nast-date-num {
    font-size: 1.1em;
    font-weight: 700;
    color: var(--nast-heading);
  }

  #nastenka .nast-date-day {
    font-size: 0.75em;
    font-weight: 400;
    color: var(--nast-gold);
  }

  #nastenka .nast-progress {
    position: absolute;
    top: 0;
    left: 0;
    right: var(--nast-progress-right, 0px);
    height: 0.18em;
    background: var(--nast-gold-soft);
    transform-origin: left;
    transform: scaleX(0);
  }

  #nastenka .nast-dots {
    display: flex;
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 3;
    align-items: center;
    gap: 0;
    transform: translate(-50%, -50%);
  }

  #nastenka .nast-dot {
    display: grid;
    flex: 0 0 1.5em;
    place-items: center;
    width: 1.5em;
    height: 1.5em;
    padding: 0;
    font-size: inherit;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }

  #nastenka .nast-dot::before {
    content: "";
    display: block;
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    background: var(--nast-bg-mid);
    transition: background var(--vs-fade) ease;
  }

  #nastenka .nast-dot:focus-visible {
    outline: 2px solid var(--nast-primary-dark);
    outline-offset: 3px;
  }

  #nastenka .nast-dot.nast-active {
    background: transparent;
  }

  #nastenka .nast-dot.nast-active::before {
    background: var(--nast-primary);
  }

  /* body */
  #nastenka .nast-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 0.4em 0.5em;
    transition:
      opacity var(--vs-fade) ease,
      transform var(--vs-fade) ease;
    /* Jemna modra textura pod ostatnymi kartami; plocha pod nou je gradient z #nastenka. */
    background:
      radial-gradient(rgba(83, 120, 145, 0.13) 1px, transparent 1.6px) 0 0 / 13px 13px,
      radial-gradient(rgba(255, 255, 255, 0.55) 1px, transparent 1.6px) 6px 6px / 17px 17px;
    background-attachment: local;
  }

  #nastenka .nast-body::-webkit-scrollbar {
    display: none;
  }

  #nastenka .nast-body.nast-transparent {
    opacity: 0;
    transform: translateY(-10px);
  }

  #nastenka .nast-slide {
    display: flex;
    flex-direction: column;
    gap: 0.9em;
  }

  #nastenka .nast-slide.nast-hidden {
    display: none !important;
  }

  #nastenka .nast-reveal {
    animation: nast-reveal 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: var(--nast-delay, 0ms);
  }

  @keyframes nast-reveal {
    from {
      opacity: 0;
      transform: translateY(1.1em) scale(0.92);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* shared */
  #nastenka .nast-card,
  #nastenka .nast-item,
  #nastenka .nast-note {
    background: var(--nast-panel);
    border: 1px solid var(--nast-border);
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(64, 100, 125, 0.08);
  }

  #nastenka .nast-card {
    padding: 1em 1.1em;
  }

  #nastenka .nast-section-title {
    margin-bottom: 0.5em;
    font-size: 1.15em;
    font-weight: 700;
    color: var(--nast-heading);
  }

  #nastenka .nast-slide > .nast-section-title {
    margin: 0.3em 0 -0.2em;
  }

  #nastenka h4:not(.nast-embed *) {
    font-size: 0.95em;
    font-weight: 700;
    color: var(--nast-heading);
  }

  #nastenka .nast-body p:not(.nast-embed *) {
    font-size: 0.8em;
    color: var(--nast-text);
  }

  /* Obsah pluginov je v rem/px, preto sa skaluje transformom (funguje aj na starsich TV prehliadacoch); mierky nastavuje skript. */
  #nastenka .nast-embed {
    --nast-s: var(--nast-zoom, 1);
  }

  #nastenka #nast-rozpis-slot {
    --nast-s: var(--nast-rozpis-zoom, 1);
  }

  #nastenka .nast-scale-outer {
    position: relative;
  }

  #nastenka .nast-scaled {
    width: calc(100% / var(--nast-s, 1));
    transform: scale(var(--nast-s, 1));
    transform-origin: 0 0;
  }

  /* Pri priblizeni je obsah uzsi nez okno, takze sa media queries pluginu nespustia; rozpis ich nahradi container query. */
  #nastenka #nast-rozpis-slot {
    container-type: inline-size;
  }

  @container (max-width: 840px) {
    #nastenka #nast-rozpis-slot .rozpis-omsi--nastenka .priest-card {
      grid-template-columns: minmax(0, 1fr) max-content;
      gap: 5px;
      align-items: start;
    }

    #nastenka #nast-rozpis-slot .rozpis-omsi--nastenka .time-block,

    var oznamyDateLoading = false;
    var oznamyDateNextAt = 0;
    var isValidDateKey = function (value) {

      var date = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));

        dots[i].classList.toggle("nast-active", i === index);
        dots[i].setAttribute("aria-current", i === index ? "true" : "false");
      });
      layoutAll();
      syncScaledHeights();
      revealContent(slides[index]);
      if (updateSubtitle !== false) {
        subtitleEl.textContent = slides[index].title;
      }
      body.scrollTo({ top: 0, behavior: "auto" });
    };

    var switchTo = async function (index, version) {
      subtitleEl.classList.remove("nast-subtitle-enter", "nast-subtitle-exit");
      void subtitleEl.offsetWidth;
      subtitleEl.classList.add("nast-subtitle-exit");

      if (reducedMotion.matches || FADE_MS === 0) {
        if (version === navigationVersion) setActive(index, false);
      } else {
        body.classList.add("nast-transparent");
        await sleep(FADE_MS);
        if (version === navigationVersion) setActive(index, false);
        void body.offsetHeight; // reflow, aby sa spustil transition
        body.classList.remove("nast-transparent");
        if (version === navigationVersion) await sleep(FADE_MS);
      }
      if (version !== navigationVersion) return;
      subtitleEl.textContent = slides[index].title;
      subtitleEl.classList.remove("nast-subtitle-exit");
      void subtitleEl.offsetWidth;
      subtitleEl.classList.add("nast-subtitle-enter");
    };

    // Plynuly posun konstantnou rychlostou; skonci aj pri rucnom prepnuti karty (wakeAll).
    var animateScroll = function (to, fixedDurationMs, speed) {
      return new Promise(function (resolve) {
        var from = body.scrollTop;
        var durationMs = fixedDurationMs || (Math.abs(to - from) / (speed || SCROLL_SPEED)) * 1000;
        var start = null;
        var done = false;
        var startVersion = navigationVersion;
        var finish = function () {
          if (done) return;
          done = true;
          var i = wakers.indexOf(finish);
          if (i >= 0) wakers.splice(i, 1);
          resolve();
        };
        wakers.push(finish);
        var step = function (ts) {
          if (done) return;
          // Pri ručnom prepnutí karty sa posun zastaví; promise ukončí až wakeAll().
          if (startVersion !== navigationVersion) return;
          if (start === null) start = ts;
          var t = durationMs > 0 ? Math.min((ts - start) / durationMs, 1) : 1;
          var progress = fixedDurationMs ? t * t * (3 - 2 * t) : t;
          body.scrollTop = from + (to - from) * progress;
          if (t < 1) requestAnimationFrame(step);
          else finish();
        };
        requestAnimationFrame(step);
      });
    };

    var createFirstSlideScrollPlan = function () {
      var viewportHeight = body.clientHeight;
      var scrollHeight = body.scrollHeight;
      var maxTop = Math.max(0, scrollHeight - viewportHeight);
      var startTop = Math.min(body.scrollTop, maxTop);
      if (body.scrollTop > maxTop) body.scrollTop = maxTop;

      var distance = maxTop - startTop;
      var tolerance = Math.max(BOTTOM_TOLERANCE, viewportHeight * 0.005);
      var targets = [];
      if (viewportHeight > 0 && distance > tolerance) {
        var preferredStep = viewportHeight * FIRST_SLIDE_TARGET_STEP_RATIO;
        var minStep = viewportHeight * FIRST_SLIDE_MIN_STEP_RATIO;
        var maxStep = viewportHeight * FIRST_SLIDE_MAX_STEP_RATIO;
        var count = Math.max(1, Math.round(distance / preferredStep));
        while (distance / count > maxStep) count++;
        if (count > 1 && distance / count < minStep && distance / (count - 1) <= maxStep) {
          count--;
        }
        for (var i = 1; i <= count; i++) {
          targets.push(i === count ? maxTop : startTop + (distance * i) / count);
        }
      } else if (distance > 0) {
        body.scrollTop = maxTop;
      }

      return {
        targets: targets,
        scrollHeight: body.scrollHeight,
        viewportHeight: body.clientHeight,
      };
    };

    var getFirstSlideReadPause = function () {
      var viewport = body.getBoundingClientRect();
      var blocks = slides[0].el.querySelectorAll(".oznamy-content > *");
      var visibleWords = 0;
      blocks.forEach(function (block) {
        var text = block.textContent.trim();
        if (!text) return;
        var rect = block.getBoundingClientRect();
        var height = rect.height;
        if (height <= 0) return;
        var visibleHeight = Math.max(0, Math.min(rect.bottom, viewport.bottom) - Math.max(rect.top, viewport.top));
        if (visibleHeight <= 0) return;
        var words = text.match(/\S+/g);
        visibleWords += (words ? words.length : 0) * Math.min(1, visibleHeight / height);
      });
      var estimatedMs = (3 + visibleWords / FIRST_SLIDE_WORDS_PER_SECOND) * 1000;
      return Math.max(FIRST_SLIDE_MIN_READ_MS, Math.min(FIRST_SLIDE_MAX_READ_MS, estimatedMs));
    };

    var getFirstSlideScrollDuration = function (distance) {
      var viewportHeight = Math.max(1, body.clientHeight);
      var estimatedMs = (distance / (viewportHeight * FIRST_SLIDE_SCROLL_SPEED_RATIO)) * 1000;
      return Math.max(FIRST_SLIDE_MIN_SCROLL_MS, Math.min(FIRST_SLIDE_MAX_SCROLL_MS, estimatedMs));
    };

    // Plagaty pod sebou: progress pokryva pauzu aj posun na dalsi plagat.
    var runPosterStack = async function (grid, version) {
      var count = Math.max(1, grid.querySelectorAll("figure").length);
      for (var i = 0; i < count; i++) {
        var scrollMs = i < count - 1 && !reducedMotion.matches ? POSTER_STACK_SCROLL_MS : 0;
        restartProgress(POSTER_STACK_DWELL_MS + scrollMs);
        await wait(POSTER_STACK_DWELL_MS);
        if (version !== navigationVersion) return;
        if (i < count - 1) {
          var pageH = parseFloat(grid.dataset.nastPage) || body.clientHeight;
          var maxTop = Math.max(0, body.scrollHeight - body.clientHeight);
          var target = Math.min((i + 1) * pageH, maxTop);
          if (reducedMotion.matches) body.scrollTop = target;
          else await animateScroll(target, POSTER_STACK_SCROLL_MS);
          if (version !== navigationVersion) return;
        }
      }
    };

    var run = async function () {
      mountRozpis();
      setActive(activeIndex);
      while (true) {
        var version = navigationVersion;
        var slide = slides[activeIndex];
        if (activeIndex === 0) {
          var firstEmbed = embeds.filter(function (embed) {
            return embed.typ === "oznamy";
          })[0];
          while (firstEmbed && !firstEmbed.settled) {
            restartProgress(FIRST_SLIDE_LOADING_PAUSE_MS);
            await wait(FIRST_SLIDE_LOADING_PAUSE_MS);
            if (version !== navigationVersion) break;
          }
          if (version !== navigationVersion) continue;

          var firstSlidePlan = createFirstSlideScrollPlan();
          var firstSlideHasScrolled = false;
          var firstSlideNeedsDwell = true;
          if (!firstSlidePlan.targets.length) {
            var noScrollMs = slide.durationSeconds * 1000;
            restartProgress(noScrollMs);
            await wait(noScrollMs);
            if (version !== navigationVersion) continue;
            firstSlidePlan = createFirstSlideScrollPlan();
            firstSlideNeedsDwell = false;
          }

          while (true) {
            if (firstSlideNeedsDwell) {
              var readPauseMs = getFirstSlideReadPause();
              restartProgress(readPauseMs);
              await wait(readPauseMs);
              if (version !== navigationVersion) break;
            }

            if (
              firstSlidePlan.scrollHeight !== body.scrollHeight ||
              firstSlidePlan.viewportHeight !== body.clientHeight
            ) {
              firstSlidePlan = createFirstSlideScrollPlan();
            }
            if (!firstSlidePlan.targets.length) break;

            var firstSlideTargetTop = firstSlidePlan.targets.shift();
            var firstSlideDistance = Math.max(0, firstSlideTargetTop - body.scrollTop);
            var firstSlideTolerance = Math.max(BOTTOM_TOLERANCE, body.clientHeight * 0.005);
            if (firstSlideDistance <= firstSlideTolerance) {
              firstSlidePlan = createFirstSlideScrollPlan();
              firstSlideNeedsDwell = firstSlideHasScrolled;
              continue;
            }

            var scrollDurationMs = getFirstSlideScrollDuration(firstSlideDistance);
            if (reducedMotion.matches) {
              body.scrollTop = firstSlideTargetTop;
            } else {
              await animateScroll(firstSlideTargetTop, scrollDurationMs);
            }
            if (version !== navigationVersion) break;
            firstSlideHasScrolled = true;
            firstSlideNeedsDwell = true;
            if (
              firstSlidePlan.scrollHeight !== body.scrollHeight ||
              firstSlidePlan.viewportHeight !== body.clientHeight
            ) {
              firstSlidePlan = createFirstSlideScrollPlan();
            }
          }
          if (version !== navigationVersion) continue;
          activeIndex = (activeIndex + 1) % slides.length;
          await switchTo(activeIndex, navigationVersion);
          continue;
        }
        var stackGrid = slide.board ? slide.el.querySelector(".oznamy-images.nast-stack") : null;
        if (stackGrid) {
          await runPosterStack(stackGrid, version);
          if (version !== navigationVersion) continue;
          activeIndex = (activeIndex + 1) % slides.length;
          await switchTo(activeIndex, navigationVersion);
          continue;
        }
        var slideDurationMs = slide.durationSeconds * 1000;
        if (slide.board) {
          var posterCount = slide.el.querySelectorAll("figure.oznamy-img-item").length;
          if (posterCount > 0 && posterCount <= POSTER_FIT_MAX) {
            slideDurationMs = posterCount <= 2 ? 13000 : 18000;
          }
        }
        var maxTop = Math.max(0, body.scrollHeight - body.clientHeight);
        var scrolls = slide.scroll && maxTop > BOTTOM_TOLERANCE;
        var scrollMs = scrolls && !reducedMotion.matches ? (maxTop / slide.scrollSpeed) * 1000 : 0;
        var totalMs = Math.max(slideDurationMs, scrolls ? SCROLL_PAUSE_MS * 2 + scrollMs : 0);
        var initialTotalMs = totalMs;
        var startedAt = Date.now();
        if (slide.scroll) {
          restartProgress(totalMs);
          await wait(SCROLL_PAUSE_MS);
          if (version !== navigationVersion) continue;
          // Obsah sa mohol dotiahnut az po zobrazeni karty, preto sa vyska meria znova.
          var targetTop = Math.max(0, body.scrollHeight - body.clientHeight);
          var hasScroll = targetTop > BOTTOM_TOLERANCE;
          var actualScrollMs = hasScroll && !reducedMotion.matches ? (targetTop / slide.scrollSpeed) * 1000 : 0;
          totalMs = Math.max(slideDurationMs, hasScroll ? SCROLL_PAUSE_MS * 2 + actualScrollMs : 0);
          var elapsedMs = Date.now() - startedAt;
          var remainingMs = Math.max(0, totalMs - elapsedMs);
          continueProgress(elapsedMs / initialTotalMs, remainingMs);
          if (hasScroll) {
            if (reducedMotion.matches) body.scrollTop = targetTop;
            else await animateScroll(targetTop, null, slide.scrollSpeed);
            if (version !== navigationVersion) continue;
          }
        } else {
          restartProgress(totalMs);
        }
        var remainingMs = Math.max(0, totalMs - (Date.now() - startedAt));
        await wait(remainingMs);
        if (version !== navigationVersion) continue;
        activeIndex = (activeIndex + 1) % slides.length;
        await switchTo(activeIndex, navigationVersion);
      }
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", run);
    } else {
      run();
    }
  })();
</script>
